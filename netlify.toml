[build]
  command = "npm run build"
  # Vite outputs to client/dist (see client/vite.config.js)
  publish = "client/dist"

[build.environment]
  # These values are not secrets: VITE_* are intentionally bundled into the browser
  # (publishable key + project URL), and the rest are plain config that also appears
  # in source/docs (port, bucket names, region, public WhatsApp number).
  # Real secrets (SUPABASE_SECRET_KEY, S3 keys, admin password) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,PORT,SUPABASE_S3_PUBLIC_BUCKET,SUPABASE_S3_PRIVATE_BUCKET,SUPABASE_S3_REGION,WHATSAPP_PHONE_NUMBER"

# Single-page app: let React Router handle client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
